<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Auth Bridge — Настройки</title>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #2aabee;
      --green: #3fb950; --red: #f85149; --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; line-height: 1.6;
      max-width: 480px; margin: 0 auto; padding: 32px 20px;
    }
    h1 { font-size: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
    label { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase;
            letter-spacing: .06em; margin-bottom: 6px; }
    input[type="url"], input[type="text"] {
      width: 100%; padding: 9px 12px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    .field { margin-bottom: 20px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
    button {
      background: var(--accent); color: #000; border: none; cursor: pointer;
      border-radius: var(--radius); font-size: 13px; font-weight: 600;
      padding: 9px 18px; transition: opacity .15s;
    }
    button:hover { opacity: .88; }
    #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .ok  { color: var(--green); }
    .err { color: var(--red); }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .danger-zone h2 { font-size: 14px; color: var(--red); margin-bottom: 12px; }
    .btn-danger {
      background: transparent; color: var(--red);
      border: 1px solid var(--red); border-radius: var(--radius);
      font-size: 13px; font-weight: 600; padding: 7px 14px; cursor: pointer;
      transition: background .15s;
    }
    .btn-danger:hover { background: rgba(248,81,73,.1); }
  </style>
</head>
<body>

  <h1><span>🌉</span> Cloud Auth Bridge — Настройки</h1>

  <div class="field">
    <label for="profile-name">Имя профиля</label>
    <input id="profile-name" type="text" placeholder="определится автоматически" maxlength="32">
    <p class="hint" id="profile-hint">Загрузка…</p>
    <p class="hint" style="margin-top:4px">Определяется автоматически по Google-аккаунту Chrome.<br>
       Переопредели если нужно другое имя: <code>work</code>, <code>personal</code>.<br>
       Токены идут с префиксом: <code>vladimir.figma</code>, <code>vladimir.github</code>.</p>
  </div>

  <div class="field">
    <label for="relay-url">URL token-relay сервера</label>
    <input id="relay-url" type="url" placeholder="http://localhost:8081">
    <p class="hint">Локальный: <code>http://localhost:8081</code><br>
       Продакшн: <code>https://136-65-7-197.sslip.io</code></p>
  </div>

  <button id="btn-save">Сохранить</button>
  <p id="msg"></p>

  <hr>

  <div class="danger-zone">
    <h2>⚠ Сброс</h2>
    <button class="btn-danger" id="btn-reset">Отключить и сбросить всё</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
