<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Auth Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🤖</span>
        <span class="logo-text">Cloud Auth Bridge</span>
      </div>
      <button class="btn-icon hidden" id="btn-options" title="Настройки">⚙️</button>
    </header>

    <!-- UNPAIRED view -->
    <div id="view-unpaired" class="view hidden">
      <p class="hint">Введи код из Telegram-бота<br>(<a href="tg://resolve?domain=super_personal_assistant_bot&start=chromeext_connect" id="tg-link"><code>/chromeext_connect</code></a>)</p>
      <div class="code-input-row">
        <input id="code-input" type="text" inputmode="numeric" maxlength="7"
               placeholder="482 931" autocomplete="off" spellcheck="false">
      </div>
      <button id="btn-pair" class="btn-primary">Подключить</button>
      <p id="pair-error" class="error hidden"></p>
    </div>

    <!-- PAIRED view -->
    <div id="view-paired" class="view hidden">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Подключено</span>
        <span id="profile-badge" class="profile-badge hidden"></span>
      </div>

      <div id="current-site" class="site-card hidden">
        <div class="site-label" id="site-label-text"></div>
        <button id="btn-send-token" class="btn-primary">Передать токен</button>
        <p id="send-error" class="error hidden"></p>
        <p id="send-ok" class="ok hidden">✓ Токен передан</p>
      </div>

      <div id="no-site" class="no-site">
        <p>Перейди на нужный сайт,<br>чтобы передать токен.</p>
      </div>

      <!-- Quick capture buttons -->
      <div class="quick-capture">
        <div class="quick-label">Быстрый захват</div>
        <div class="quick-buttons">
          <button class="btn-quick" data-url="https://github.com" data-after="github.com" data-label="github">GitHub</button>
          <button class="btn-quick" data-url="https://www.figma.com" data-after="figma.com" data-label="figma">Figma</button>
          <button class="btn-quick" data-url="https://www.notion.so" data-after="notion.so" data-label="notion">Notion</button>
          <button class="btn-quick" data-url="https://linear.app" data-after="linear.app" data-label="linear">Linear</button>
          <button class="btn-quick" data-url="https://tilda.cc" data-after="tilda.cc" data-label="tilda">Tilda</button>
          <button class="btn-quick" data-url="https://lknpd.nalog.ru" data-after="nalog.ru" data-label="nalog">Nalog НПД</button>
          <button class="btn-quick" data-url="https://claude.ai" data-after="claude.ai" data-label="claude">Claude</button>
        </div>
        <p id="quick-status" class="hint hidden"></p>
      </div>

      <button id="btn-disconnect" class="btn-secondary">Отключить</button>
    </div>

    <!-- Loading -->
    <div id="view-loading" class="view">
      <div class="spinner"></div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
